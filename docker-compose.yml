name: kalman-hub

# Values come from the stack's environment variables (Portainer) or a .env file next to
# this file (docker compose CLI). See .env.example.

services:
  hub:
    build: .
    image: kalman-hub:latest
    environment:
      - HUB_CLAUDE_TOKEN=${HUB_CLAUDE_TOKEN:?set HUB_CLAUDE_TOKEN}
      - HUB_PEPPER_TOKEN=${HUB_PEPPER_TOKEN:?set HUB_PEPPER_TOKEN}
      - HUB_TIMEZONE=${HUB_TIMEZONE:-Europe/London}
      - HUB_SOON_DAYS=${HUB_SOON_DAYS:-21}
      - HUB_STALE_HOURS=${HUB_STALE_HOURS:-36}
    volumes:
      - hub-data:/data
    networks:
      - kalman-hub
    restart: unless-stopped

  # Publishes the hub's public listener (MCP only, Claude token only) with Tailscale Funnel.
  tailscale:
    image: tailscale/tailscale:latest
    hostname: kalman-hub
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?set TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - ts-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    networks:
      - kalman-hub
    depends_on:
      - hub
    restart: unless-stopped

# Tailscale fills in TS_CERT_DOMAIN itself; $$ stops compose from substituting it.
configs:
  ts-serve:
    content: |
      {
        "TCP": { "443": { "HTTPS": true } },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": { "/": { "Proxy": "http://hub:8081" } }
          }
        },
        "AllowFunnel": { "$${TS_CERT_DOMAIN}:443": true }
      }

volumes:
  hub-data:
  ts-state:

# Attach Pepper's container to this network so it can reach http://hub:8080 privately.
networks:
  kalman-hub:
    name: kalman-hub
