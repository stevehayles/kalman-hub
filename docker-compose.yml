name: kalman-hub

# Values come from the stack's environment variables (Portainer) or a .env file next to
# this file (docker compose CLI). See .env.example.

services:
  hub:
    build: .
    image: kalman-hub:latest
    # Built locally from this repo, so never try to pull it from a registry.
    pull_policy: build
    environment:
      - HUB_CLAUDE_TOKEN=${HUB_CLAUDE_TOKEN:?set HUB_CLAUDE_TOKEN}
      - HUB_PEPPER_TOKEN=${HUB_PEPPER_TOKEN:?set HUB_PEPPER_TOKEN}
      - HUB_TIMEZONE=${HUB_TIMEZONE:-Europe/London}
      - HUB_SOON_DAYS=${HUB_SOON_DAYS:-21}
      - HUB_STALE_HOURS=${HUB_STALE_HOURS:-36}
    volumes:
      - hub-data:/data
    networks:
      - kalman-hub
    restart: unless-stopped

  # Publishes the hub's public listener (MCP only, Claude token only) through a
  # Cloudflare Tunnel. In the Cloudflare dashboard, point the tunnel's public hostname
  # at http://hub:8081.
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:?set TUNNEL_TOKEN}
    networks:
      - kalman-hub
    depends_on:
      - hub
    restart: unless-stopped

volumes:
  hub-data:

# Attach Pepper's container to this network so it can reach http://hub:8080 privately.
networks:
  kalman-hub:
    name: kalman-hub
