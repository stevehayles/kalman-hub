name: kalman-hub

services:
  hub:
    build: .
    image: kalman-hub:latest
    env_file: .env
    volumes:
      - hub-data:/data
    networks:
      - kalman-hub
    restart: unless-stopped

  # Publishes the hub's public listener (MCP only, Claude token only) with Tailscale Funnel.
  tailscale:
    image: tailscale/tailscale:latest
    hostname: kalman-hub
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - ts-state:/var/lib/tailscale
      - ./tailscale:/config:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    networks:
      - kalman-hub
    depends_on:
      - hub
    restart: unless-stopped

volumes:
  hub-data:
  ts-state:

# Attach Pepper's container to this network so it can reach http://hub:8080 privately.
networks:
  kalman-hub:
    name: kalman-hub
